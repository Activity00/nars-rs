name: nars-agent

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust tests and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --release
      - name: Deterministic evaluation
        run: |
          cargo run --release -p nars-eval -- \
            --provider scripted \
            --out target/eval-report.json \
            --markdown-out target/eval-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: nars-agent-eval-report
          path: |
            target/eval-report.json
            target/eval-report.md

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
